---
###################
# Bootstrap vault #
###################
- name: Check if Ansible vault password already exists
  ansible.builtin.stat:
    path: "/home/{{ controller_key_owner }}/.vault_pass"
  register: vault_pass_file
  no_log: true

- name: Generate and store Ansible vault password (first run only)
  block:
    - name: Generate cryptographically secure vault password
      ansible.builtin.command: openssl rand -base64 32
      register: vault_pass_gen
      changed_when: true
      no_log: true

    - name: Write vault password to secure file
      ansible.builtin.copy:
        content: "{{ vault_pass_gen.stdout }}"
        dest: "/home/{{ controller_key_owner }}/.vault_pass"
        owner: "{{ controller_key_owner }}"
        group: "{{ controller_key_owner }}"
        mode: '0600'
      no_log: true
  when: not vault_pass_file.stat.exists

#################
# Bootstrap SSH #
#################
- name: Generate the LXC→target SSH keypair (owned by default user)
  community.crypto.openssh_keypair:
    path: "{{ controller_key_path }}"
    type: ed25519
    owner: "{{ controller_key_owner }}"
    group: "{{ controller_key_owner }}"
    mode: "0600"

############################
# Bare-metal configuration #
############################
- name: Write non-sensitive config
  copy:
    content: |
      controller_static_ip: "{{ controller_static_ip }}"
      llm_static_ip: "{{ llm_static_ip }}"
      proxmox_static_ip: "{{ proxmox_static_ip }}"
      proxmox_node_name: "{{ proxmox_node_name }}"
      gateway_ip: "{{ gateway_ip }}"
      subnet_range: "{{ subnet_range }}"
      base_domain: "{{ base_domain }}"
    dest: "{{ inventory_dir }}/group_vars/controller_hosts/config.yml"
    mode: '0644'
  when: proxmox_static_ip is defined and proxmox_static_ip | length > 0 

##############################
# Check for existing secrets #
##############################
- name: Check whether network vault has been seeded
  ansible.builtin.stat: 
    path: "{{ network_vars_path }}/vault.yml" 
  register: network_vault_file 

- name: Check whether Vaultwarden vault has been seeded
  ansible.builtin.stat: 
    path: "{{ services_vars_path }}/vault.yml" 
  register: vaultwarden_vault_file

- name: Check whether Proxmox API token has been seeded
  ansible.builtin.stat: 
    path: "{{ controller_vars_path }}/vault.yml" 
  register: proxmox_vault_file 

#############################
# Provision missing secrets #
#############################
# Cloudflare
- name: Seed Cloudflare token into stack vault
  block:
    - name: Encrypt token under stack password
      ansible.builtin.command:
        cmd: >
          ansible-vault encrypt_string
          --vault-password-file /home/{{ controller_key_owner }}/.vault_pass
          --stdin-name vault_cloudflare_api_token
        stdin: "{{ stack_cloudflare_token }}"
      register: encrypted_cloudflare_token 
      changed_when: true
      no_log: true 

    - name: Write encrypted token to vault
      ansible.builtin.copy: 
        content: "{{ encrypted_cloudflare_token.stdout }}"
        dest: "{{ network_vars_path }}/vault.yml"
        owner: "{{ controller_key_owner }}"
        group: "{{ controller_key_owner }}" 
        mode: '0640'
      no_log: true
  when: not network_vault_file.stat.exists 

# Proxmox
- name: Seed Proxmox API token into stack vault
  block:
    - name: Encrypt token under stack password
      ansible.builtin.command:
        cmd: >
          ansible-vault encrypt_string
          --vault-password-file /home/{{ controller_key_owner }}/.vault_pass
          --stdin-name vault_proxmox_api_token
        stdin: "{{ stack_proxmox_api_token }}"
      register: encrypted_proxmox_api_token 
      changed_when: true
      no_log: true 

    - name: Write encrypted token to vault
      ansible.builtin.copy: 
        content: "{{ encrypted_proxmox_api_token.stdout }}"
        dest: "{{ controller_vars_path }}/vault.yml"
        owner: "{{ controller_key_owner }}"
        group: "{{ controller_key_owner }}" 
        mode: '0640'
      no_log: true
  when: not proxmox_vault_file.stat.exists
  
# Vaultwarden
- name: Seed Vaultwarden secrets into stack vault
  block:
    - name: Encrypt password under stack password
      ansible.builtin.command:
        cmd: >
          ansible-vault encrypt_string
          --vault-password-file /home/{{ controller_key_owner }}/.vault_pass
          --stdin-name vault_vaultwarden_secret
        stdin: "{{ stack_vaultwarden_secret | trim }}"
        stdin_add_newline: false
      register: encrypted_vaultwarden_password
      changed_when: true
      no_log: true 

    - name: Generate Vaultwarden admin token
      ansible.builtin.set_fact: 
        stack_vaultwarden_admin_token: "{{ lookup('community.general.random_string', length=32, special=false) }}"
      no_log: true

    - name: Generate Argon2 hash of admin token
      ansible.builtin.shell:
        cmd: >
          echo -n "{{ stack_vaultwarden_admin_token }}" |
          argon2 "$(openssl rand -base64 32)" -id -t 3 -m 16 -p 4 -l 32 -e
      register: vaultwarden_admin_token_hash
      changed_when: false
      no_log: true

    - name: Encrypt admin token using vault pass
      ansible.builtin.command:
        cmd: >
          ansible-vault encrypt_string
          --vault-password-file /home/{{ controller_key_owner }}/.vault_pass
          --stdin-name vault_vaultwarden_admin_token
        stdin: "{{ stack_vaultwarden_admin_token | trim }}"
        stdin_add_newline: false
      register: encrypted_admin_token
      changed_when: true
      no_log: true

    - name: Encrypt Argon2 hash of admin token 
      ansible.builtin.command:
        cmd: >
          ansible-vault encrypt_string
          --vault-password-file /home/{{ controller_key_owner }}/.vault_pass
          --stdin-name vault_vaultwarden_admin_token_hash
        stdin: "{{ vaultwarden_admin_token_hash.stdout | trim  }}"
        stdin_add_newline: false
      register: encrypted_admin_token_hash
      changed_when: true
      no_log: true

    - name: Write to vault
      ansible.builtin.copy:
        content: |
          {{ encrypted_vaultwarden_password.stdout }}
          {{ encrypted_admin_token.stdout }}
          {{ encrypted_admin_token_hash.stdout }}
        dest: "{{ services_vars_path }}/vault.yml"
        owner: "{{ controller_key_owner }}"
        group: "{{ controller_key_owner }}" 
        mode: '0640'
      no_log: true
  when: not vaultwarden_vault_file.stat.exists       
