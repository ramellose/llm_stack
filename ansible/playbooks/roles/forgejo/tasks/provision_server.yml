---
- name: Ensure admin Vaultwarden session
  ansible.builtin.include_role:
    name: secrets
    tasks_from: session
    apply:
      delegate_to: "{{ secrets_controller_host }}"
  vars:
    ansible_become: false
    bw_email: "admin@{{ base_domain }}"
    bw_master_password: "{{ hostvars[secrets_controller_host].vault_vaultwarden_secret }}"

- name: Retrieve Forgejo admin API token
  ansible.builtin.include_role:
    name: secrets
    tasks_from: get_secret
    apply:
      delegate_to: "{{ secrets_controller_host }}"
  loop:
    - name: forgejo-admin-api-token
  loop_control:
    loop_var: secret
    label: "{{ secret.name }}"

- name: Set admin token fact
  ansible.builtin.set_fact:
    forgejo_admin_token: "{{ vw_resolved['forgejo-admin-api-token'] }}"
  no_log: true

- name: Provision each organization
  ansible.builtin.include_tasks: tasks/provision_org.yml
  loop: "{{ forgejo_orgs | dict2items }}"
  loop_control:
    loop_var: org
    label: "{{ org.key }}"

- name: "Reset agent specs"
  ansible.builtin.set_fact:
    user_vault_secrets: []
    forgejo_pw_secrets: []
    team_member_specs: []

- name: "Build combined principal list"
  ansible.builtin.set_fact:
    principals: "{{ agents | default([]) + (humans | default([])) }}"

- name: "Build vault-account specs"
  ansible.builtin.set_fact:
    user_vault_secrets: "{{ user_vault_secrets + [{'name': 'vault-account-' + item.name}] }}"
  loop: "{{ principals }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Build forgejo-password specs"
  ansible.builtin.set_fact:
    forgejo_pw_secrets: "{{ forgejo_pw_secrets + [{'name': 'forgejo-password-' + item.name, 'username': item.forgejo.user, 'generate_cmd': vw_gen_cmd}] }}"
  loop: "{{ principals }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Get agent vault master passwords [all agents]"
  ansible.builtin.include_role:
    name: secrets
    tasks_from: get_secret
    apply:
      delegate_to: "{{ secrets_controller_host }}"
  loop: "{{ user_vault_secrets }}"
  loop_control:
    loop_var: secret
    label: "{{ secret.name }}"

- name: "Get Forgejo passwords from admin vault [all agents]"
  ansible.builtin.include_role:
    name: secrets
    tasks_from: insert_secret
    apply:
      delegate_to: "{{ secrets_controller_host }}"
  vars:
    vw_overwrite: false
  loop: "{{ forgejo_pw_secrets }}"
  loop_control:
    loop_var: secret
    label: "{{ secret.name }}"

- name: Provision each agent
  ansible.builtin.include_tasks: provision_user.yml
  loop: "{{ principals }}"
  loop_control:
    loop_var: agent
    label: "{{ agent.name }}"

- name: "Build machine-user membership specs"
  ansible.builtin.set_fact:
    team_member_specs: "{{ team_member_specs | default([]) + [{'org': item.0.forgejo.org, 'team': item.1, 'user': item.0.forgejo.user}] }}"
  loop: "{{ principals | subelements('forgejo.teams', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.forgejo.user }} -> {{ item.1 }}"

- name: Reconcile team membership per organization
  ansible.builtin.include_tasks: tasks/provision_members.yml
