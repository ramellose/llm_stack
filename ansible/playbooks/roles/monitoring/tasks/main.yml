---
##########
# auditd #
##########
- name: Install auditd
  apt:
      name:
        - auditd
        - audispd-plugins
      state: present

- name: Deploy auditd rules
  copy:
    dest: /etc/audit/rules.d/hardening.rules
    content: |
      # Delete all existing rules
      -D
      # Set buffer size
      -b 8192
      # Failure mode 1 = log failures silently (not 2, which panics/halts)
      -f 1

      # --- Identity and authentication ---
      -w /etc/passwd -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /etc/group -p wa -k identity
      -w /etc/sudoers -p wa -k identity
      -w /etc/sudoers.d/ -p wa -k identity

      # --- SSH ---
      -w /etc/ssh/sshd_config -p wa -k sshd_config

      # --- Login events ---
      -w /var/log/auth.log -p wa -k auth_log
      -w /var/log/faillog -p wa -k logins
      -w /var/run/utmp -p wa -k session
      -w /var/log/wtmp -p wa -k session

      # --- Privilege escalation ---
      -a always,exit -F arch=b64 -S setuid -k privilege_escalation
      -a always,exit -F arch=b32 -S setuid -k privilege_escalation

      # --- Suspicious activity ---
      -w /tmp -p x -k tmp_execution
      -w /dev/shm -p x -k shm_execution
    owner: root
    group: root
    mode: '0640'
  notify: Reload auditd rules

- name: Ensure auditd is enabled and running
  service:
    name: auditd
    state: started
    enabled: true

#################
# Node Exporter #
#################
- name: Create node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Check if Node Exporter is installed
  ansible.builtin.stat:
    path: /usr/local/bin/node_exporter
  register: node_exporter_binary

- name: Download Node Exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    mode: '0644'
  when: not node_exporter_binary.stat.exists

- name: Extract Node Exporter binary
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    dest: /tmp
    remote_src: true
  when: not node_exporter_binary.stat.exists

- name: Install Node Exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: node_exporter
    group: node_exporter
    mode: '0755'
    remote_src: true
  when: not node_exporter_binary.stat.exists
  notify: Restart node_exporter

- name: Deploy Node Exporter systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Node Exporter
      After=network.target

      [Service]
      User=node_exporter
      Group=node_exporter
      Type=simple
      ExecStart=/usr/local/bin/node_exporter
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  notify: Restart node_exporter

- name: Enable and start Node Exporter
  ansible.builtin.service:
    name: node_exporter
    state: started
    enabled: true
