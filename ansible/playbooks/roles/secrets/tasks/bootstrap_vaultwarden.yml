---
- name: Install dependencies
  ansible.builtin.apt:
    name: 
      - python3-venv
    state: present 

- name: Create venv for registration crypto
  ansible.builtin.command:
    cmd: python3 -m venv {{ vault_compose_dir }}/venv-crypto
    creates: "{{ vault_compose_dir }}/venv-crypto/bin/python"

- name: Install cryptography into venv
  ansible.builtin.command:
    cmd: "{{ vault_compose_dir }}/venv-crypto/bin/pip install cryptography==44.0.0"
    creates: "{{ vault_compose_dir }}/venv-crypto/lib/python*/site-packages/cryptography/__init__.py"

- name: Deploy hash derivation helper (static, no secrets)
  ansible.builtin.copy:
    src: files/registration.py
    dest: "{{ vault_compose_dir }}/registration.py"
    mode: "0755"

### Redeploy Vaultwarden
- name: Enable signups
  ansible.builtin.lineinfile:
    path: "{{ vault_compose_dir }}/docker-compose.yml"
    regexp: 'SIGNUPS_ALLOWED:.*'
    line: '      SIGNUPS_ALLOWED: "true"'

- name: Redeploy with signups enabled
  community.docker.docker_compose_v2:
    project_src: "{{ vault_compose_dir }}"
    state: present
    recreate: always

- name: Wait for API
  ansible.builtin.uri:
    url: "{{ vault_domain }}/alive"
    method: GET
  register: api_ping
  until: api_ping.status == 200
  retries: 30
  delay: 5

- name: Register accounts
  block:
    ### Admin 
    - name: Probe admin
      uri:
        url: "{{ vault_domain }}/api/accounts/login"
        method: POST
        body_format: json
        body:
          email: "{{ vault_admin_mail }}"
          masterPassword: "{{ vault_admin_pass }}"
      register: admin_check
      failed_when: false
      changed_when: false
      no_log: true

    - name: Create admin account
      when: admin_check.status != 200 # Combine admin+agent existence check
      block:

      - name: Create admin
        ansible.builtin.include_role:
          name: secrets
          tasks_from: register_account.yml
        vars:
          reg_email: "{{ vault_admin_mail }}"
          reg_password: "{{ vault_admin_pass }}"
          reg_name: "Stack Admin"

    ### Agents
    - name: Ensure Vaultwarden session 
      ansible.builtin.include_role:
        name: secrets
        tasks_from: session
        apply:
            delegate_to: "{{ secrets_controller_host }}"
      vars:
        bw_email: "admin@{{ base_domain }}"
        bw_master_password: "{{ hostvars[secrets_controller_host].vault_vaultwarden_secret }}"

    - name: Register agents
      ansible.builtin.include_tasks: register_agent.yml
      loop: "{{ agents }}"
      loop_control: { loop_var: agent, label: "{{ agent.name }}" }

  always:
    - name: Disable signups
      ansible.builtin.lineinfile:
        path: "{{ vault_compose_dir }}/docker-compose.yml"
        regexp: 'SIGNUPS_ALLOWED:.*'
        line: '      SIGNUPS_ALLOWED: "false"'

    - name: Redeploy with signups disabled
      community.docker.docker_compose_v2:
        project_src: "{{ vault_compose_dir }}"
        state: present
        recreate: always
