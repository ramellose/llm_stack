---
- name: Get secret
  vars:
    ansible_become: false 
  block:
  - name: "[{{ secret.name }}] Validate request"
    ansible.builtin.assert:
      that:
        - secret.name is defined and secret.name | length > 0
      fail_msg: "Secret name missing or empty."

  - name: Sync Vaultwarden vault
    ansible.builtin.command: bw sync
    changed_when: false
    environment:
      BW_SESSION: "{{ bw_session }}"

  - name: "Find existing value for [{{ secret.name }}]"
    ansible.builtin.command: "bw list items --search {{ secret.name | quote }}"
    register: bw_existing
    changed_when: false
    environment:
      BW_SESSION: "{{ bw_session }}"

  - name: "Resolve item for [{{ secret.name }}]"
    ansible.builtin.set_fact:
      existing_item: >-
        {{ (bw_existing.stdout | from_json)
          | selectattr('name', 'equalto', secret.name)
          | list | first | default(None) }}

  - name: "Assert secret [{{ secret.name }}] exists"
    ansible.builtin.assert:
      that:
        - existing_item is not none
      fail_msg: >-
        Secret '{{ secret.name }}' not found in Vaultwarden.
        Cannot retrieve — was it ever stored?

  - name: "Resolve [{{ secret.name }}]"
    ansible.builtin.set_fact:
      _resolved_value: "{{ existing_item.login.password }}"

  - name: "Return [{{ secret.name }}]"
    ansible.builtin.set_fact:
      vw_resolved: "{{ vw_resolved | default({}) | combine({ secret.name: _resolved_value }) }}"
