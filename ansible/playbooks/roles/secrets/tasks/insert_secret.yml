---
- name: Insert secret
  vars:
    ansible_become: false 
  block:
  - name: Assert usable session
    ansible.builtin.assert:
      that:
        - bw_session is defined
        - bw_session | length > 0
      fail_msg: >-
        insert_secret called without a valid bw_session. Establish a session
        (roles/secrets/tasks/session.yml) before reconciling secrets.
      quiet: true

  - name: Sync Vaultwarden vault
    ansible.builtin.command: bw sync
    changed_when: false
    environment:
      BW_SESSION: "{{ bw_session }}"

  - name: "Find existing value for [{{ secret.name }}]"
    ansible.builtin.command: "bw list items --search {{ secret.name | quote }}"
    register: bw_existing
    changed_when: false
    environment:
      BW_SESSION: "{{ bw_session }}"

  - name: "Resolve match for [{{ secret.name }}]"
    ansible.builtin.set_fact:
      existing_item: >-
        {{ (bw_existing.stdout | default('[]', true) | from_json)
          | selectattr('name', 'equalto', secret.name)
          | list | first | default(None) }}

  - name: "Regenerate value for [{{ secret.name }}]?"
    ansible.builtin.set_fact:
      _needs_new_value: "{{ (existing_item is none) or (vw_overwrite | bool) }}"

  - name: "[{{ secret.name }}] Generate value via command"
    ansible.builtin.command: "{{ secret.generate_cmd }}"
    register: _generated
    changed_when: false
    when:
      - _needs_new_value | bool
      - secret.generate_cmd is defined

  - name: "Resolve value for [{{ secret.name }}]"
    ansible.builtin.set_fact:
      _resolved_value: >-
        {{
          (_generated.stdout
            if (_needs_new_value and secret.generate_cmd is defined)
            else (secret.value
              if secret.value is defined
              else existing_item.login.password))
        }}

  - name: "Build payload for [{{ secret.name }}]"
    ansible.builtin.set_fact:
      _item_payload:
        type: 1
        name: "{{ secret.name }}"
        login:
          username: "{{ secret.username | default('') }}"
          password: "{{ _resolved_value }}"

  - name: "Create [{{ secret.name }}]"
    ansible.builtin.shell:
      cmd: "echo {{ _item_payload | to_json | quote }} | bw encode | bw create item"
    when: existing_item is none
    changed_when: true
    environment:
      BW_SESSION: "{{ bw_session }}"

  - name: "Overwrite [{{ secret.name }}]"
    ansible.builtin.shell:
      cmd: "echo {{ _item_payload | to_json | quote }} | bw encode | bw edit item {{ existing_item.id }}"
    when:
      - existing_item is not none
      - vw_overwrite | bool
    changed_when: true
    environment:
      BW_SESSION: "{{ bw_session }}"

  - name: "Generate return value for [{{ secret.name }}]"
    ansible.builtin.set_fact:
      vw_resolved: "{{ vw_resolved | default({}) | combine({ secret.name: _resolved_value }) }}"
