---
- name: Prelogin - get KDF params
  ansible.builtin.uri:
    url: "{{ vault_domain }}/api/accounts/prelogin"
    method: POST
    body_format: json
    body:
      email: "{{ reg_email }}"
  register: prelogin

- name: Derive registration data
  ansible.builtin.command:
    argv:
      - "{{ vault_compose_dir }}/venv-crypto/bin/python"
      - "{{ vault_compose_dir }}/registration.py"
    stdin: "{{ {'password': reg_password, 'email': reg_email, 'kdf_iterations': prelogin.json.kdfIterations} | to_json }}"
  register: reg_crypto
  no_log: true

- name: "Register account for [{{ reg_email }}]"
  ansible.builtin.uri:
    url: "{{ vault_domain }}/identity/accounts/register"
    method: POST
    body_format: json
    body:
      email: "{{ reg_email }}"
      name: "{{ reg_name }}"
      masterPasswordHash: "{{ (reg_crypto.stdout | from_json).masterPasswordHash }}"
      masterPasswordHint: null
      key: "{{ (reg_crypto.stdout | from_json).key }}"
      kdf: "{{ prelogin.json.kdf }}"
      kdfIterations: "{{ prelogin.json.kdfIterations }}"
      keys:
        publicKey: "{{ (reg_crypto.stdout | from_json).publicKey }}"
        encryptedPrivateKey: "{{ (reg_crypto.stdout | from_json).encryptedPrivateKey }}"
    status_code: [200, 400]
    return_content: true
  register: register_result
  no_log: true
  
- name: "Return registration result for [{{ reg_email }}]"
  ansible.builtin.set_fact:
    registered_account:
      email: "{{ reg_email }}"
      password: "{{ reg_password }}"
      created: "{{ register_result.status == 200 }}"
  no_log: true
