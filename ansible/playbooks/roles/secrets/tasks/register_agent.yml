---
- name: "Get [{{ agent.name }}] vault secret"
  ansible.builtin.include_role:
    name: secrets
    tasks_from: insert_secret
    apply:
      delegate_to: "{{ secrets_controller_host }}"
  vars:
    vw_overwrite: false
  loop:
    - name: "vault-account-{{ agent.name }}"
      username: "{{ agent.name }}@{{ base_domain }}"
      generate_cmd: "{{ vw_gen_cmd }}"
  loop_control:
    loop_var: secret
    label: "{{ secret.name }}"

- name: "[{{ agent.name }}] Retrieve the stored password"
  ansible.builtin.include_role:
    name: secrets
    tasks_from: get_secret
    apply:
      delegate_to: "{{ secrets_controller_host }}"
  loop:
    - name: "vault-account-{{ agent.name }}"
  loop_control:
    loop_var: secret
    label: "{{ secret.name }}"

- name: "[{{ agent.name }}] Register Vaultwarden account (idempotent; 400 if exists)"
  ansible.builtin.include_role:
    name: secrets
    tasks_from: register_account
  vars:
    reg_email: "{{ agent.name }}@{{ base_domain }}"
    reg_password: "{{ vw_resolved['vault-account-' + agent.name] }}"
    reg_name: "{{ agent.name }}"
