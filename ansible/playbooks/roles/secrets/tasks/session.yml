---
- name: Set session
  vars:
    ansible_become: false
  block:
  - name: Log out any existing session
    ansible.builtin.command: bw logout
    failed_when: false
    changed_when: true
    
  - name: Log in
    ansible.builtin.command: "bw login {{ bw_email | quote }} --raw"
    args:
      stdin: "{{ bw_master_password }}"
    changed_when: true
    register: bw_login
    no_log: true

  - name: Set session
    ansible.builtin.set_fact:
      bw_session: "{{ bw_login.stdout }}"
    no_log: true
